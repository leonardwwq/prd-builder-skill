<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MOCK · 页面名 · 状态</title>
<style>
  :root{
    --line:#e5e7eb; --text:#111827; --sub:#6b7280; --bg:#f3f4f6;
    --new:#dc2626; --mod:#2563eb; --warn:#f59e0b; --brand:#3b82f6;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);padding:0 0 64px}

  /* 顶部说明条：每个 mock 必须有 */
  .docbar{position:sticky;top:0;z-index:99;background:var(--brand);color:#fff;padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .docbar b{font-size:15px}
  .docbar span{opacity:.85;font-size:12px}

  /* 画布：PC 1440 / 移动 375，按需选一个或多个 */
  .canvas{background:#fff;margin:20px auto;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .canvas.pc{width:1440px;max-width:calc(100% - 40px)}
  .canvas.mobile{width:375px;border-radius:20px;border:8px solid #111827}

  .canvas .hd{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .canvas .hd h1{font-size:16px}
  .canvas .bd{padding:20px}
  .state-tag{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:2px 10px}

  /* 通用控件，够用就行，别在这里造设计系统 */
  .btn{display:inline-block;padding:6px 16px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
  .field .req::after{content:"*";color:var(--new);margin-left:4px}
  .input{width:100%;max-width:420px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;color:var(--text);background:#fff}
  .input.err{border-color:var(--new)}
  .err-tip{color:var(--new);font-size:12px;margin-top:4px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
  th{background:#f9fafb;font-weight:600;color:var(--sub)}
  .empty{padding:48px;text-align:center;color:var(--sub)}

  /* 改动标注 */
  .changed{position:relative;outline:2px dashed var(--new);outline-offset:3px;border-radius:4px}
  .modified{position:relative;outline:2px dashed var(--mod);outline-offset:3px;border-radius:4px}
  .removed{text-decoration:line-through;color:#9ca3af;background:#fef2f2;padding:0 4px;border-radius:3px}
  [data-note]::before{
    content:attr(data-note);position:absolute;top:-11px;left:-11px;z-index:5;
    width:20px;height:20px;border-radius:50%;background:var(--warn);color:#fff;
    font-size:12px;line-height:20px;text-align:center;font-weight:700;
  }

  /* 图例：标注必须逐条解释 */
  .legend{width:1440px;max-width:calc(100% - 40px);margin:24px auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 20px}
  .legend h2{font-size:14px;margin-bottom:10px}
  .legend li{list-style:none;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .legend li:last-child{border:0}
  .badge{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--warn);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-right:8px;font-weight:700}

  .footbar{position:fixed;left:0;right:0;bottom:0;background:#111827;color:#d1d5db;font-size:12px;padding:8px 20px;display:flex;justify-content:space-between}
</style>
</head>
<body>

<div class="docbar">
  <b>提交反馈 · 默认态</b>
  <span>⚠️ 虚构示例，仅演示 mock 写法，不是真实需求</span>
  <span>关联：R-01-001 / G-01-001</span>
</div>
<div class="canvas pc">
  <div class="hd"><h1>提交反馈</h1><span class="state-tag">默认态</span></div>
  <div class="bd">
    <div class="field changed" data-note="1">
      <label class="req">反馈类型</label>
      <select class="input"><option>问题</option><option>建议</option></select>
    </div>
    <div class="field changed" data-note="2">
      <label class="req">反馈内容</label>
      <textarea class="input" rows="4">点击“保存”按钮后页面没有反应，刷新后草稿也丢了。</textarea>
    </div>
    <span class="btn primary">提交</span>
  </div>
</div>
<div class="legend">
  <h2>改动点说明</h2>
  <ul>
    <li><span class="badge">1</span>新增「反馈类型」，枚举：问题 / 建议，默认问题</li>
    <li><span class="badge">2</span>新增「反馈内容」，10–500 字（R-01-001）</li>
  </ul>
</div>
<div class="footbar">
  <span>MOCK（示例）· mocks/01-默认态.html</span>
  <span>v1.0 · 2026-01-15</span>
</div>
</body>
</html>
